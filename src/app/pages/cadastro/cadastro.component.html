<app-auth-frame>
  <header class="auth-heading">
    <h1>Criar conta</h1>
    <p>Faça parte da comunidade EcoTech.</p>
  </header>
  <form #form="ngForm" (ngSubmit)="register()" [attr.aria-busy]="request.busy">
    <label
      >Nome
      <input
        name="name"
        autocomplete="name"
        required
        minlength="2"
        maxlength="100"
        [(ngModel)]="input.name"
    /></label>
    <label
      >Nome de usuário
      <input
        name="username"
        autocomplete="username"
        required
        minlength="3"
        maxlength="30"
        [(ngModel)]="input.username"
    /></label>
    <label
      >E-mail
      <input
        name="email"
        type="email"
        autocomplete="email"
        required
        email
        minlength="10"
        maxlength="150"
        [(ngModel)]="input.email"
    /></label>
    <label
      >Senha
      <input
        name="password"
        type="password"
        autocomplete="new-password"
        required
        minlength="6"
        maxlength="72"
        [(ngModel)]="input.password"
    /></label>
    <button
      class="primary"
      type="submit"
      [disabled]="form.invalid || request.busy || canResume"
    >
      @if (request.busy) {
        <span class="spinner" aria-hidden="true"></span>
      }
      {{ request.busy ? "Criando conta…" : "Criar conta" }}
      @if (!request.busy) {
        <span class="button-arrow" aria-hidden="true">→</span>
      }
    </button>
  </form>
  @if (features.googleLogin) {
    <div class="auth-divider" aria-hidden="true"><span>ou</span></div>
    <a class="google-button" [href]="googleUrl">
      <svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Cadastrar com Google
    </a>
  }
  <app-status [state]="request" label="Criando a conta…"></app-status>
  @if (canResume) {
    <a class="secondary-link" routerLink="/boas-vindas"
      >Continuar configuração</a
    >
  }
  <p class="auth-footer">
    Já tem uma conta? <a routerLink="/login">Faça login</a>
  </p>
</app-auth-frame>
