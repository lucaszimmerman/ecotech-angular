<section class="surface composer">
  <h2>Nova publicação</h2>
  <form (ngSubmit)="publish(image)" [attr.aria-busy]="request.busy">
    <label>
      <span class="visually-hidden">O que você quer compartilhar?</span>
      <textarea name="content" placeholder="Compartilhe uma ideia, projeto ou iniciativa sustentável…"
        [(ngModel)]="content" required maxlength="2000" rows="3"></textarea>
    </label>
    @if (preview) {
      <div class="preview-frame">
        <img [src]="preview" class="preview" alt="Prévia da publicação" />
        <button type="button" class="icon-button preview-remove" aria-label="Remover imagem" title="Remover imagem"
          [disabled]="request.busy" (click)="clearImage(); image.value = ''">
          <app-icon name="close"></app-icon>
        </button>
      </div>
    }
    <div class="composer-footer">
      <label class="file-trigger">
        <app-icon name="image"></app-icon> {{ file ? "Trocar foto" : "Adicionar foto" }}
        <input #image class="visually-hidden" type="file" [accept]="types" [disabled]="request.busy" (change)="choose(image)" />
      </label>
      <app-char-count [value]="content" [min]="5" [max]="2000"></app-char-count>
      <button class="primary" type="submit" [disabled]="request.busy || unknown || content.trim().length < 5">
        @if (request.busy) {
          <span class="spinner" aria-hidden="true"></span> Publicando…
        } @else {
          <app-icon name="send"></app-icon> Publicar
        }
      </button>
    </div>
  </form>
  <app-status [state]="request" label="Publicando…"></app-status>
  @if (createdId) {
    <a [routerLink]="['/post', createdId]">Ver publicação criada</a>
  }
  @if (unknown) {
    <div class="actions">
      <a routerLink="/home" [queryParams]="{ vista: 'todos' }">Conferir em Explorar</a>
      <button type="button" (click)="unknown = false">Já conferi</button>
    </div>
  }
</section>
